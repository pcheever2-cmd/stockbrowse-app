# Cloudflare Pages configuration for Astro site with API functions
name = "stockbrowse-app-pages"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

# KV namespace for premium stock data (sharded per symbol as stock:AAPL etc.)
[[kv_namespaces]]
binding = "STOCKS_PREMIUM_KV"
id = "a16202c79b5b4372b3a686d6a4f8baf1"

# KV namespace for the curated theme catalog + miss logging + rate-limit/budget counters
[[kv_namespaces]]
binding = "SEARCH_CACHE_KV"
id = "95b947c54df24b9c9df6f850e0cfd8c1"

# Workers AI — embeddings (bge-base-en-v1.5) + Llama query parsing for semantic search
[ai]
binding = "AI"

# Vectorize — semantic search index over stock descriptions (768-dim, cosine)
[[vectorize]]
binding = "VECTORIZE"
index_name = "stockbrowse-stocks"

# Vectorize — curated theme catalog index (768-dim, cosine); vector id = theme slug
[[vectorize]]
binding = "VECTORIZE_THEMES"
index_name = "stockbrowse-themes"

# Secret values should be set in the Cloudflare Pages dashboard:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   RESEND_API_KEY (v2)
